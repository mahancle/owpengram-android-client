name: Build Mobugram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Change App Name to mobugram
        run: |
          find . -name "strings.xml" -exec sed -i 's/>OwpenGram</>mobugram</g' {} +

      - name: Inject API Keys
        run: |
          echo "APP_ID=${{ secrets.APP_ID }}" >> gradle.properties
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> gradle.properties

      - name: Build Standalone Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobugram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
